name: CI

on:
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore server

      - name: Build
        run: dotnet build server --configuration Release --no-restore

      - name: Test
        run: dotnet test server --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Check formatting
        working-directory: client
        run: npm run format:check

      - name: Build
        working-directory: client
        run: npm run build

      - name: Audit production dependencies
        working-directory: client
        run: npm audit --omit=dev --audit-level=high

  windows-scripts:
    name: Windows scripts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Parse PowerShell scripts with Windows PowerShell
        shell: powershell
        run: |
          $failed = $false

          foreach ($file in (git ls-files "*.ps1")) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file),
              [ref]$tokens,
              [ref]$errors) | Out-Null

            foreach ($errorRecord in $errors) {
              Write-Error "$file`: $($errorRecord.Message)"
              $failed = $true
            }
          }

          if ($failed) {
            exit 1
          }

      - name: Verify service data-path guards
        shell: powershell
        run: .\tools\test-service-paths.ps1

      - name: Verify service update and rollback transactions
        shell: powershell
        run: .\tools\test-service-update.ps1

  container:
    name: Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: VERSION=0.0.0
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
